# Plex auth overlay. Requires PLEX_MACHINE_ID in .env (Plex Media Server
# Settings → General → "Machine Identifier", or GET http://plex:32400/identity).
#
#   docker compose -f docker-compose.yml -f docker-compose.plex.yml up -d
services:
  yomi-reader:
    environment:
      AUTH_PROVIDER: plex
      PLEX_MACHINE_ID: ${PLEX_MACHINE_ID:?set PLEX_MACHINE_ID}
      # PUBLIC_BASE_URL: https://yomi.example.com   # optional; for /auth/login redirect
      # COOKIE_SECURE: "true"                       # when behind HTTPS
      ADMIN_USER: ""
      ADMIN_PASS: ""
